<!doctype html>

        <h1>홍재영</h1>

        <p class="affiliation">국립공주대학교 기계자동차공학부</p>

        <p class="intro">많하랑 운동을 좋아합니다!</p>

      <section class="profile-grid" aria-label="프로필 정보">
        <article class="info-card about-card">
          <p class="card-number">01</p>
          <h2>About me</h2>

          <h2>Interests</h2>
          <!-- 관심사 자리표시자: 아래 항목을 수정하거나 추가하세요. -->
          <ul class="tag-list">
            <li>만화</li>
            <li>운동</li>
            <li>다이어트</li>
          </ul>
        </article>

        <article class="info-card class-card">
          <p class="card-number">03</p>
          <h2>Class</h2>
          <!-- 수업 자리표시자: 아래 수업명을 수정하세요. -->
          <p class="class-name">미래첨단기술의이해 I</p>
        </article>
      </section>

      <footer class="contact">
        <p class="contact-label">GET IN TOUCH</p>
        <div class="contact-links">
          <!-- 이메일 자리표시자: href와 표시 텍스트를 함께 수정하세요. -->

          <!-- GitHub 자리표시자: href와 표시 텍스트를 함께 수정하세요. -->
          <a href="https://hjy1229.githup.io">hjy1229.githup.io <span aria-hidden="true">↗</span></a>
